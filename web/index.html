<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zar-logs</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app viz-root">
  <aside class="side">
    <div class="brand">
      <div class="brand-name">zar-logs</div>
      <div class="status" id="status"><span class="dot"></span><span class="status-text">starting</span></div>
      <button class="btn small" id="overlay-toggle" hidden></button>
      <button class="btn records-btn" id="records-open" title="The best missions of your own characters, per game version">Records</button>
    </div>
    <div class="side-head"><span>Encounters</span><button class="btn small" id="import-open" title="Add mission logs from files someone shared">Import…</button></div>
    <nav class="enc-list" id="enc-list"></nav>
    <div class="side-foot">
      <button class="btn small" id="about-open">About, AI use and methods</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="tooltip" id="tooltip" hidden></div>
<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
