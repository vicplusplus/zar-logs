[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/layoutgen", "crates/unity", "crates/namespack", "crates/gearcalc", "crates/buildview", "src-tauri"]

[workspace.package]
version = "0.3.1"
edition = "2021"
authors = ["vicplusplus"]
repository = "https://github.com/vicplusplus/zar-logs"
license = "MIT"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
